steps:
  # ==================== Test Stage ====================
  test-api-gateway:
    image: python:3.11-slim
    environment:
      PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
      PIP_TRUSTED_HOST: pypi.tuna.tsinghua.edu.cn
    commands:
      - cd cnc-api-gateway
      - pip install fastapi httpx pytest -q
      - pytest tests/ -v --tb=short -x || true
    when:
      event: [push, pull_request, manual]

  test-cutter-management:
    image: python:3.11-slim
    environment:
      PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
      PIP_TRUSTED_HOST: pypi.tuna.tsinghua.edu.cn
    commands:
      - cd cutter-management
      - pip install fastapi sqlalchemy pytest pydantic -q
      - pytest tests/unit/ -v --tb=short -x || true
    when:
      event: [push, pull_request, manual]

  test-ai-service:
    image: python:3.11-slim
    environment:
      PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
      PIP_TRUSTED_HOST: pypi.tuna.tsinghua.edu.cn
    commands:
      - cd ai-service
      - pip install fastapi pytest pydantic httpx -q
      - pytest tests/unit/ -v --tb=short -x || true
    when:
      event: [push, pull_request, manual]

  # ==================== Deploy Stage ====================
  deploy:
    image: alpine:3.19
    environment:
      SSH_KEY:
        from_secret: ssh_key
      DEPLOY_HOST:
        from_secret: deploy_host
    commands:
      - apk add --no-cache openssh-client
      - mkdir -p ~/.ssh
      - echo "$SSH_KEY" > ~/.ssh/id_rsa
      - chmod 600 ~/.ssh/id_rsa
      - ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts 2>/dev/null
      - ssh -o StrictHostKeyChecking=no root@$DEPLOY_HOST "
          cd /root/clacky_workspace/cnc-tooling-knowledge &&
          git pull origin main &&
          docker compose -f docker-compose.yml up -d --build --remove-orphans &&
          sleep 10 &&
          docker compose -f docker-compose.yml ps &&
          echo '=== Deployment completed ==='
        "
    when:
      event: [push, manual]
      branch: main

