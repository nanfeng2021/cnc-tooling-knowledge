steps:
  test:
    image: python:3.11-slim
    environment:
      PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
      PIP_TRUSTED_HOST: pypi.tuna.tsinghua.edu.cn
    commands:
      - pip install -e ".[dev]" -q
      - pytest tests/unit/ -v --tb=short
    when:
      event: [push, pull_request, manual]

