# Logstash 配置 - 接收和处理CNC服务日志

input {
  # 从Filebeat接收日志
  beats {
    port => 5044
  }

  # 也可以直接接收TCP日志
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # 解析JSON格式的结构化日志
  json {
    source => "message"
    target => "log"
  }

  # 如果是来自CNC服务的日志
  if [fields][service] {
    # 添加服务标识
    mutate {
      add_field => { "service_name" => "%{[fields][service]}" }
    }

    # 提取时间戳
    date {
      match => [ "[log][timestamp]", "ISO8601" ]
      target => "@timestamp"
    }

    # 提取日志级别
    if [log][level] {
      mutate {
        add_field => { "log_level" => "%{[log][level]}" }
      }
    }

    # 提取trace_id用于请求追踪
    if [log][trace_id] {
      mutate {
        add_field => { "trace_id" => "%{[log][trace_id]}" }
      }
    }
  }

  # 移除不需要的字段
  mutate {
    remove_field => ["host", "agent", "ecs", "log", "input"]
  }
}

output {
  # 输出到Elasticsearch
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "cnc-tooling-logs-%{+YYYY.MM.dd}"
  }

  # 调试时可以输出到stdout
  # stdout { codec => rubydebug }
}