# Prometheus Configuration
# 监控三个微服务的指标

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # API Gateway
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['111.228.18.127:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Cutter Management Service
  - job_name: 'cutter-management'
    static_configs:
      - targets: ['111.228.18.127:8001']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # AI Service
  - job_name: 'ai-service'
    static_configs:
      - targets: ['111.228.18.127:8002']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Prometheus自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
